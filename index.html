<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial</title>
    <style>
        /* CSS / Tampilan */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .question-box {
            background-color: #ffb7dd;
            color: #4a0033;
            padding: 25px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(255, 183, 221, 0.4);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            background-color: white;
            color: #333;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .btn-yes:hover {
            border-color: #ff77bc;
            color: #d6006e;
        }

        .btn-no:hover {
            border-color: #ff5252;
            color: #d32f2f;
        }

        /* Tampilan Respon */
        .response-card {
            display: none;
            padding: 25px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .response-yes {
            background-color: #ffb7dd;
            color: #4a0033;
            box-shadow: 0 4px 10px rgba(255, 183, 221, 0.4);
        }

        .response-no {
            background-color: #ff5252;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 82, 82, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kotak Pertanyaan -->
        <div class="question-box">
            HAII mau hadiah? jawab ini dulu<br><br>
            yu love me or no?
        </div>

        <!-- Tombol Pilihan -->
        <div class="buttons">
            <button class="btn btn-yes" onclick="showResponse('yes')">YES</button>
            <button class="btn btn-no" onclick="showResponse('no')">NO</button>
        </div>

        <!-- Pesan Jawaban YES -->
        <div id="response-yes" class="response-card response-yes">
            AWWW LOVEEE YUU JUGAAA BEBBB<br>
            muachh muachhhhh &lt;3333
        </div>

        <!-- Pesan Jawaban NO -->
        <div id="response-no" class="response-card response-no">
            HUFTTT PRENKKKKKK FAK YUUQQ
        </div>
    </div>

    <script>
        // JavaScript / Logika Interaktif
        function showResponse(type) {
            const yesCard = document.getElementById('response-yes');
            const noCard = document.getElementById('response-no');

            if (type === 'yes') {
                yesCard.style.display = 'block';
                noCard.style.display = 'none';
            } else if (type === 'no') {
                noCard.style.display = 'block';
                yesCard.style.display = 'none';
            }
        }
    </script>
</body>
</html>
