<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fde047; /* Warna kuning cerah */
            background-image: radial-gradient(#ca8a04 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Canvas animasi ditaruh paling belakang agar TIDAK MENUTUPI tombol */
        #effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important; /* PENTING: Mencegah canvas menghalangi klik */
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 999; /* PENTING: Container ada di posisi paling atas */
            border: 2px solid #facc15;
        }

        .question-box {
            background-color: #ffb7dd;
            color: #4a0033;
            padding: 25px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.15rem;
            line-height: 1.5;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(255, 183, 221, 0.5);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            position: relative;
            z-index: 1000;
        }

        button {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            background-color: #ffffff;
            color: #333;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer !important;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-yes:hover {
            border-color: #ff77bc;
            background-color: #fff0f7;
            color: #d6006e;
        }

        .btn-no:hover {
            border-color: #ff5252;
            background-color: #fff5f5;
            color: #d32f2f;
        }

        .response-card {
            display: none;
            padding: 25px 20px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .response-yes {
            background-color: #ffb7dd;
            color: #4a0033;
            box-shadow: 0 6px 15px rgba(255, 183, 221, 0.5);
        }

        .response-no {
            background-color: #ff5252;
            color: white;
            box-shadow: 0 6px 15px rgba(255, 82, 82, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Canvas Efek Animasi di Paling Belakang -->
    <canvas id="effect-canvas"></canvas>

    <div class="container">
        <div class="question-box">
            HAII mau hadiah? jawab ini dulu<br><br>
            yu love me or no?
        </div>

        <div class="buttons">
            <button type="button" id="btn-yes" class="btn-yes">YES</button>
            <button type="button" id="btn-no" class="btn-no">NO</button>
        </div>

        <div id="response-yes" class="response-card response-yes">
            AWWW LOVEEE YUU JUGAAA BEBBB<br>
            muachh muachhhhh &lt;3333
        </div>

        <div id="response-no" class="response-card response-no">
            HUFTTT PRENKKKKKK FAK YUUQQ
        </div>
    </div>

    <script>
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const yesCard = document.getElementById('response-yes');
        const noCard = document.getElementById('response-no');
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let animationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(type) {
                this.type = type;
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 15 + 20;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                
                if (type === 'love') {
                    const items = ['💖', '💗', '💕', '🌸', '❤️'];
                    this.char = items[Math.floor(Math.random() * items.length)];
                } else {
                    const items = ['🔥', '💥', '✨', '⚡'];
                    this.char = items[Math.floor(Math.random() * items.length)];
                }
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > canvas.height + 50) {
                    this.y = -30;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.font = `${this.size}px serif`;
                ctx.fillText(this.char, this.x, this.y);
            }
        }

        function startEffect(type) {
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(type));
            }
            if (!animationId) {
                animate();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            animationId = requestAnimationFrame(animate);
        }

        // Event listener dengan pencegahan default untuk sensitivitas sentuhan di HP
        function handleYes(e) {
            if (e) e.preventDefault();
            yesCard.style.display = 'block';
            noCard.style.display = 'none';
            startEffect('love');
        }

        function handleNo(e) {
            if (e) e.preventDefault();
            noCard.style.display = 'block';
            yesCard.style.display = 'none';
            startEffect('fire');
        }

        btnYes.addEventListener('click', handleYes);
        btnNo.addEventListener('click', handleNo);
    </script>
</body>
</html>
