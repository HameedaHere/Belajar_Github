<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial Untuk Aulia ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Layar Utama: Amplop -->
    <div class="container" id="envelopeSection">
        <div class="pulse-ring"></div>
        <div class="envelope-card" onclick="openEnvelope()">
            <div class="heart-badge">💖</div>
            <h2>Ada pesan manis untuk Aulia ✨</h2>
            <p>Ketuk di sini untuk membuka amplopnya</p>
        </div>
    </div>

    <!-- Layar Isi Surat (Awalnya tersembunyi) -->
    <div class="container hidden" id="letterSection">
        <div class="letter-card">
            <span class="sparkle s1">✨</span>
            <span class="sparkle s2">🌸</span>
            <span class="sparkle s3">💖</span>
            
            <div class="recipient-tag">Untuk: Aulia (Bububb) 💕</div>
            
            <div class="message-body">
                <p>i love you bububbb</p>
                <p class="highlight">semangatt buat besokk yaa!! 🌸✨</p>
            </div>

            <button class="hug-btn" onclick="sendHug(event)">
                Kirim Pelukan Hangat 🤗
            </button>
            
            <div class="footer-note">Dibuat dengan 💖 oleh Anindita</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
