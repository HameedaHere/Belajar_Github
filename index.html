<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fde047; /* Warna kuning cerah */
            background-image: radial-gradient(#ca8a04 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Canvas untuk animasi Hujan Love / Api */
        #effect-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 20;
            border: 2px solid #facc15;
        }

        .question-box {
            background-color: #ffb7dd;
            color: #4a0033;
            padding: 25px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.15rem;
            line-height: 1.5;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(255, 183, 221, 0.5);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            background-color: white;
            color: #333;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-yes:hover {
            border-color: #ff77bc;
            background-color: #fff0f7;
            color: #d6006e;
        }

        .btn-no:hover {
            border-color: #ff5252;
            background-color: #fff5f5;
            color: #d32f2f;
        }

        .response-card {
            display: none;
            padding: 25px 20px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .response-yes {
            background-color: #ffb7dd;
            color: #4a0033;
            box-shadow: 0 6px 15px rgba(255, 183, 221, 0.5);
        }

        .response-no {
            background-color: #ff5252;
            color: white;
            box-shadow: 0 6px 15px rgba(255, 82, 82, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Canvas Efek Animasi -->
    <canvas id="effect-canvas"></canvas>

    <div class="container">
        <div class="question-box">
            HAII mau hadiah? jawab ini dulu<br><br>
            yu love me or no?
        </div>

        <div class="buttons">
            <button id="btn-yes" class="btn-yes">YES</button>
            <button id="btn-no" class="btn-no">NO</button>
        </div>

        <div id="response-yes" class="response-card response-yes">
            AWWW LOVEEE YUU JUGAAA BEBBB<br>
